<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waruna System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* Tema konservasi: hijau bakau sebagai aksen, hijau daun untuk uang masuk, tanah liat untuk uang keluar, latar kabut lumut. */
  :root {
    --bg: #F5F8F6; --surface: #FFFFFF; --fg: #13221B; --muted: #5E6F65; --line: #E3EAE6;
    --accent: #0E7C66; --accent-soft: #E3F4EE; --accent-fg: #FFFFFF;
    --in: #2F7D22; --in-soft: #E3F1DC; --out: #B4562C; --out-soft: #F9E6DB;
    --warn: #8F6200; --warn-soft: #FBEFCB; --bad: #B3362B; --bad-soft: #FBE3DF;
    --c1: #146B57; --c2: #7FA92A; --c3: #D69E2E; --c4: #2B7A9B; --c5: #8C6A4F; --c6: #8A968D;
    --hero1: #0D4A3B; --hero2: #1F7A5A;
    --serif: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1612; --surface: #15221C; --fg: #E7F0EA; --muted: #9DB1A4; --line: #263A2F;
      --accent: #4FC3A1; --accent-soft: #14322A; --accent-fg: #052019;
      --in: #7ED67A; --in-soft: #17331F; --out: #E8996B; --out-soft: #3A2218;
      --warn: #F0B93A; --warn-soft: #3A2F10; --bad: #FF8F7E; --bad-soft: #3E1B18;
      --c1: #4FC3A1; --c2: #A5CF58; --c3: #F0B93A; --c4: #6DB6D6; --c5: #C19A78; --c6: #9DB1A4;
      --hero1: #0B3A2E; --hero2: #14604A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1612; --surface: #15221C; --fg: #E7F0EA; --muted: #9DB1A4; --line: #263A2F;
    --accent: #4FC3A1; --accent-soft: #14322A; --accent-fg: #052019;
    --in: #7ED67A; --in-soft: #17331F; --out: #E8996B; --out-soft: #3A2218;
    --warn: #F0B93A; --warn-soft: #3A2F10; --bad: #FF8F7E; --bad-soft: #3E1B18;
    --c1: #4FC3A1; --c2: #A5CF58; --c3: #F0B93A; --c4: #6DB6D6; --c5: #C19A78; --c6: #9DB1A4;
    --hero1: #0B3A2E; --hero2: #14604A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2, .brand strong, .gate-brand strong { font-family: var(--serif); letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .app { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; padding-block: 20px 56px; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 40px); overflow: auto; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; flex: none; }
  .brand strong { display: block; font-size: 1.05rem; line-height: 1.1; font-weight: 600; }
  .brand span { font-size: 0.75rem; color: var(--muted); }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 12px; padding: 11px 12px; font-weight: 600; color: var(--fg); cursor: pointer; }
  .nav button:hover { background: var(--accent-soft); }
  .nav button[aria-current="page"] { background: var(--accent); color: var(--accent-fg); }
  .nav .badge { margin-left: auto; background: var(--accent); color: var(--accent-fg); border-radius: 999px; font-size: 0.75rem; padding: 1px 7px; font-weight: 600; }
  .nav button[aria-current="page"] .badge { background: var(--accent-fg); color: var(--accent); }
  .ic { width: 20px; height: 20px; flex: none; }
  .rolebox { background: var(--bg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .rolebox select { width: 100%; }

  .main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
  .top h1 { font-size: clamp(1.4rem, 3vw, 1.8rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.good { background: var(--in); border-color: var(--in); color: #fff; }
  .btn.danger { color: var(--bad); border-color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: 0.82rem; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--line); color: var(--muted); white-space: nowrap; }
  .chip.in { background: var(--in-soft); color: var(--in); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.acc { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card h2 { font-size: 1rem; font-weight: 600; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }
  .kpi { display: flex; flex-direction: column; gap: 10px; }
  .kpi-top { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; font-size: 0.85rem; }
  .kpi-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .kpi-ic.g { background: var(--in-soft); color: var(--in); }
  .kpi-ic.w { background: var(--warn-soft); color: var(--warn); }
  .kpi-val { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; overflow-wrap: anywhere; }
  .delta { font-size: 0.78rem; font-weight: 600; }
  .delta.up { color: var(--in); } .delta.down { color: var(--bad); }
  .g2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; }
  .g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .eq { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  svg { display: block; max-width: 100%; }
  svg text { font: 500 12px var(--font); fill: var(--muted); }
  .chartbox { overflow-x: auto; }
  .chartbox svg { min-width: 420px; width: 100%; height: auto; }
  .donut-wrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .donut-wrap ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 160px; }
  .donut-wrap li { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .donut-wrap li b { margin-left: auto; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .prog { display: flex; flex-direction: column; gap: 6px; }
  .prog-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; flex-wrap: wrap; }
  .bar { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .a { background: var(--accent); }
  .bar .p { background: var(--accent); opacity: 0.35; }
  .list { display: flex; flex-direction: column; }
  .list > div { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list > div:last-child { border-bottom: 0; }
  .list .t { min-width: 0; overflow-wrap: anywhere; }

  .tblwrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
  .tbl th { text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl th.num { text-align: right; }
  .tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl tfoot td { font-weight: 600; border-bottom: 0; }
  .in-t { color: var(--in); font-weight: 600; } .out-t { color: var(--out); font-weight: 600; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
  select { cursor: pointer; }

  .rq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .rq:last-child { border-bottom: 0; }
  .rq-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .rq-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .rq-top strong { overflow-wrap: anywhere; }
  .rq-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
  .amt { font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .decision { font-size: 0.82rem; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-top: 4px; overflow-wrap: anywhere; }
  .flag { font-size: 0.8rem; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 6px 10px; margin-top: 4px; }
  .rule { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.88rem; background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
  .rule b { color: var(--accent); }

  .bs { display: flex; flex-direction: column; }
  .bs .r { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bs .r.h { font-weight: 600; border-bottom: 2px solid var(--fg); padding-top: 14px; }
  .bs .r.s { padding-left: 16px; color: var(--muted); }
  .bs .r.t { font-weight: 600; }
  .bs .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }

  .empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .banner { padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 0.85rem; }
  .banner.info { background: var(--accent-soft); color: var(--accent); }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 24, 18, 0.55); display: flex; align-items: flex-start; justify-content: center; overflow: auto;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 520px; margin-top: 4vh; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .sh-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sh-head h2 { font-size: 1.15rem; font-weight: 600; }
  .x { border: 0; background: transparent; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .sh-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  form.fm { display: flex; flex-direction: column; gap: 12px; }
  label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.82rem; color: var(--muted); }
  label.f input, label.f select, label.f textarea { color: var(--fg); font-weight: 500; font-size: 0.95rem; width: 100%; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .routebox { background: var(--bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .err { color: var(--bad); font-weight: 600; min-height: 1.2em; }
  label.f.chk { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; color: var(--fg); }
  label.f.chk input { width: auto; }
  .sheet.wide { max-width: 900px; }
  details.card summary { cursor: pointer; }
  .sum { background: var(--bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; max-width: calc(100vw - 32px); }

  .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px 28px; align-items: end; padding: 26px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, var(--hero1), var(--hero2)); }
  .hero-t { display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }
  .hero .eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.78); }
  .hero h2 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.1; font-weight: 600; text-wrap: balance; }
  .hero-t p:last-child { max-width: 46ch; color: rgba(255, 255, 255, 0.86); }
  .hero-s { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; position: relative; z-index: 1; }
  .hero-s div { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .hero-s dt { font-size: 0.75rem; color: rgba(255, 255, 255, 0.78); }
  .hero-s dd { margin: 2px 0 0; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .hero-art { position: absolute; right: -10px; top: -6px; width: min(46%, 360px); color: #fff; opacity: 0.1; pointer-events: none; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 20px; } }
  .tools { display: flex; gap: 6px; align-items: center; }
  .icbtn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; color: var(--fg); }
  .icbtn:hover { border-color: var(--accent); color: var(--accent); }
  .dotb { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font: 700 0.68rem/18px var(--font); font-style: normal; text-align: center; }
  .bottomnav { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; gap: 2px; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottomnav button { position: relative; flex: 1 0 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 0; border-radius: 12px; padding: 6px 4px; color: var(--muted); cursor: pointer; font-size: 0.75rem; font-weight: 600; }
  .bottomnav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
  .bottomnav .dotb { top: 0; right: 10px; }
  .gate { min-height: 100vh; display: grid; place-items: center; padding-block: 24px; background: radial-gradient(900px 420px at 15% -10%, var(--accent-soft), transparent 60%); }
  .gate-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 18px 50px rgba(10, 60, 44, 0.07); }
  .gate-card h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-top: 4px; }
  .gate-card { padding: 32px; gap: 16px; }
  .gate-card .muted { font-size: 0.95rem; line-height: 1.55; }
  .gate-card .fm { display: flex; flex-direction: column; gap: 14px; }
  .gate-card .fm input:focus-visible, .gate-card .btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .gate-card .btn.primary { min-height: 48px; border-radius: 14px; font-weight: 600; transition: transform .15s ease, background .2s ease; }
  .gate-card .btn.primary:hover { transform: translateY(-1px); }
  .gate-card .btn.primary:active { transform: translateY(0); }
  .gate-card .err { background: #FDF0EC; color: #9A3B1C; border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; margin: 0; }
  @keyframes gateIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .gate-card { animation: none; } .gate-card .btn.primary { transition: none; } }
  .mode-tog { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--bg, #F4F7F5); border: 1px solid var(--line); border-radius: 14px; }
  .mode-tog button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; transition: background .2s ease, color .2s ease; }
  .mode-tog button.on { background: var(--surface); color: var(--ink, var(--text)); box-shadow: 0 1px 3px rgba(10, 60, 44, 0.08); }
  .mode-tog button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .dots { display: flex; justify-content: center; gap: 14px; padding: 8px 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: transparent; transition: background .15s ease, border-color .15s ease; }
  .dot.on { background: var(--accent); border-color: var(--accent); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keypad .key, .keypad > span { min-height: 60px; }
  .keypad .key { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; font: inherit; font-size: 1.4rem; font-weight: 600; color: var(--ink, var(--text)); cursor: pointer; transition: transform .1s ease, background .15s ease; }
  .keypad .key:hover { background: var(--accent-soft); }
  .keypad .key:active { transform: scale(.96); }
  .keypad .key:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .gate-card .btn.primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .gate-card .keypad .key { min-height: 64px; }
  .gate-card .keypad { gap: 12px; }
  .gate-card .dots { padding: 12px 0; gap: 16px; }
  .gate-card .dot { width: 16px; height: 16px; }
  .link-btn { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; font-size: 0.95rem; padding: 10px; cursor: pointer; align-self: center; border-radius: 10px; }
  .link-btn:hover { text-decoration: underline; background: var(--accent-soft); }
  .link-btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .keypad .key:active { transform: none; } }

    s += '<defs><linearGradient id="gin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--in);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--in);stop-opacity:0"/></linearGradient><linearGradient id="gout" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--out);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--out);stop-opacity:0"/></linearGradient></defs>';
    for (v = 0; v <= top + 1e-6; v += step) {
      var y = T + ph - (v / top) * ph;
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--line)"/><text x="' + (L - 8) + '" y="' + (y + 3.5) + '" text-anchor="end">' + fmtT(v) + '</text>';
    }
    var xs = function (i) { return L + (ms.length === 1 ? pw / 2 : (i / (ms.length - 1)) * pw); };
    var ys = function (v2) { return T + ph - (v2 / top) * ph; };
    [['inn', 'in', 'gin', 'Masuk'], ['out', 'out', 'gout', 'Keluar']].forEach(function (c) {
      var pts = ms.map(function (m, i) { return [xs(i), ys(m[c[0]])]; }), base = T + ph;
      var line = pathSmooth(pts, base);
      s += '<path d="' + line + ' L' + pts[pts.length - 1][0] + ',' + base + ' L' + pts[0][0] + ',' + base + ' Z" fill="url(#' + c[2] + ')"/>';
      s += '<path d="' + line + '" fill="none" style="stroke:var(--' + c[1] + ')" stroke-width="2.4" stroke-linecap="round"/>';
      pts.forEach(function (p, i) { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" style="fill:var(--surface);stroke:var(--' + c[1] + ')" stroke-width="2"><title>' + c[3] + ' ' + ms[i].label + ': ' + rp(ms[i][c[0]]) + '</title></circle>'; });
    });
    ms.forEach(function (m, i) { s += '<text x="' + xs(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + m.label + '</text>'; });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik kas masuk dan keluar enam bulan terakhir">' + s + '</svg>';
  }
  function donut(items, total) {
    var R = 54, C = 2 * Math.PI * R, off = 0, s = '';
    items.forEach(function (it) {
      var len = Math.max(0, it.v / total * C - 1.5);
      s += '<circle cx="70" cy="70" r="' + R + '" fill="none" style="stroke:var(--c' + (it.i + 1) + ')" stroke-width="22" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
      off += it.v / total * C;
    });
    s += '<text x="70" y="66" text-anchor="middle" style="font-size: 12px">Total</text><text x="70" y="82" text-anchor="middle" style="font-size:12px;font-weight: 600;fill:var(--fg)">' + short(total) + '</text>';
    return '<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Pengeluaran per kategori">' + s + '</svg>';
  }

  }

  function ledger() {
    var rows = [];
    S.tx.forEach(function (t) { rows.push({ id: t.id, src: 'tx', date: t.date, kind: 'masuk', title: t.kind === 'usaha' ? (t.itemName || t.source) + ' × ' + nf(t.qty || 1, 0) : (t.name || t.source), sub: t.source + (t.kind === 'usaha' ? ' · ' + (t.name || '') : '') + (t.note ? ' · ' + t.note : ''), projectId: t.projectId, inn: t.amount, out: 0, st: '' }); });
    appr().forEach(function (r) { rows.push({ id: r.id, src: 'req', date: r.date, kind: 'keluar', title: r.item, sub: r.category + (r.vendor ? ' · ' + r.vendor : ''), projectId: r.projectId, inn: 0, out: r.amount, st: r.paid ? 'Dibayar' : 'Belum dibayar' }); });
    S.ppay.forEach(function (x) { rows.push({ id: x.id, src: 'ppay', date: x.date, kind: 'keluar', title: 'Setoran ke mitra: ' + (x.partner || '-'), sub: 'Hasil penjualan produk masyarakat' + (x.note ? ' · ' + x.note : ''), projectId: '', inn: 0, out: x.amount, st: 'Dibayar' }); });
    finalRuns().forEach(function (r) {
      Object.keys(r.byProject || {}).forEach(function (k) { rows.push({ date: r.date, kind: 'keluar', title: 'Gaji dan fee ' + monthLabel(r.id), sub: 'Termasuk iuran BPJS pemberi kerja', projectId: k === 'umum' ? '' : k, inn: 0, out: r.byProject[k], st: r.paid ? 'Dibayar' : 'Belum dibayar' }); });
    });
    rows = rows.filter(function (x) { return (F.kasType === 'all' || x.kind === F.kasType) && (F.kasProj === 'all' || (x.projectId || '') === (F.kasProj === 'umum' ? '' : F.kasProj)); });
    rows.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
    return rows;
  }
  function projOptions(sel, withAll, allLabel) {
    var o = withAll ? '<option value="all"' + (sel === 'all' ? ' selected' : '') + '>' + (allLabel || 'Semua proyek') + '</option>' : '';
    o += '<option value="' + (withAll ? 'umum' : '') + '"' + ((sel === 'umum' || sel === '') && sel !== 'all' ? ' selected' : '') + '>Operasional umum</option>';
    return o + S.projects.map(function (p) { return '<option value="' + esc(p.id) + '"' + (sel === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('');
  }
  function kas() {

    var body = rows.map(function (x) {
      return '<tr><td>' + fdate(x.date) + '</td><td><strong>' + esc(x.title) + '</strong><br><span class="muted small">' + esc(x.sub) + '</span></td><td>' + esc(projName(x.projectId)) + '</td><td class="num in-t">' + (x.inn ? rp(x.inn) : '') + '</td><td class="num out-t">' + (x.out ? rp(x.out) : '') + '</td><td>' + (x.st ? '<span class="chip ' + (x.st === 'Dibayar' ? '' : 'warn') + '">' + x.st + '</span>' : '<span class="chip in">Diterima</span>') + '</td>' + (isF ? '<td>' + (x.src ? '<div class="acts"><button class="btn sm" data-act="' + (x.src === 'tx' ? 'kas-ubah' : 'req-ubah') + '" data-id="' + esc(x.id) + '">Ubah</button><button class="btn sm danger" data-act="' + (x.src === 'tx' ? 'kas-hapus' : 'req-hapus') + '" data-id="' + esc(x.id) + '">Hapus</button></div>' : '') + '</td>' : '') + '</tr>';
    }).join('');
    return '<div class="card"><div class="filters"><label>Jenis<select data-filter="kasType"><option value="all">Semua</option><option value="masuk"' + (F.kasType === 'masuk' ? ' selected' : '') + '>Kas masuk</option><option value="keluar"' + (F.kasType === 'keluar' ? ' selected' : '') + '>Kas keluar</option></select></label><label>Proyek<select data-filter="kasProj">' + projOptions(F.kasProj, true) + '</select></label></div>' +
      '<div class="tblwrap">' + (rows.length ? '<table class="tbl"><thead><tr><th>Tanggal</th><th>Uraian</th><th>Proyek</th><th class="num">Masuk</th><th class="num">Keluar</th><th>Status</th>' + (isF ? '<th></th>' : '') + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr><td colspan="3">Jumlah</td><td class="num in-t">' + rp(ti) + '</td><td class="num out-t">' + rp(to) + '</td><td class="num">' + rp(ti - to) + '</td>' + (isF ? '<td></td>' : '') + '</tr></tfoot></table>' : '<div class="empty">Belum ada transaksi untuk filter ini.</div>') + '</div>' +

      S.projects.map(function (p) { return '<button class="pill" data-act="proj" data-id="' + esc(p.id) + '" aria-pressed="' + (sel === p.id) + '">' + esc(p.name) + '</button>'; }).join('') +

      (rekap.length ? '<div class="card"><h2>Rekap yang disetujui per kategori</h2><div class="list">' + rekap.map(function (x) { return '<div><span class="t"><span class="dot" style="background:var(--c' + (x.i + 1) + ');display:inline-block;margin-right:8px"></span>' + esc(x.c) + '</span><strong>' + rp(x.v) + '</strong></div>'; }).join('') + '</div></div>' : '');
  }

  }

  function hapusKas(id) {
